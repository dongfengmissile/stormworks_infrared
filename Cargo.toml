[package]
name = "stormworks_infrared"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "StormworksInfrared"
crate-type = ["cdylib"]

[features]
# The `logging` cfg (verbose diagnostics: throttled scan dumps, sun/weather/
# container dumps) is set from the cargo profile by build.rs — `cargo build`
# builds verbose, `cargo build --release` builds the quiet player variant.
# It is declared here so `--features logging` can force it in any profile and
# so rustc's check-cfg knows the cfg is legitimate.
logging = []

[[bin]]
name = "infrared_inject"
path = "src/bin/infrared_inject.rs"

[target.'cfg(windows)'.dependencies]
minhook = "0.9"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
